      const finalTotal = Math.max(0, originalTotal - discount);
      document.getElementById('pay-total-display').textContent = formatCurrency(finalTotal);
    }

    function calcChange(originalTotal) {
      const discount = parseFloat(document.getElementById('pay-discount').value || 0);
      const finalTotal = Math.max(0, originalTotal - discount);
      const cashGiven = parseFloat(document.getElementById('pay-cash').value || 0);
      const change = cashGiven - finalTotal;
      const display = document.getElementById('change-display');
      if (change >= 0) {
        display.textContent = `Troco: ${formatCurrency(change)}`;
      } else {
        display.textContent = `Falta: ${formatCurrency(Math.abs(change))}`;
      }
    }

    // Ações para abrir modais
    function openNovoAgendamentoModal(clientId = null) {
      state.activeModal = 'novoAgendamento';
      state.modalData = clientId ? { clientId } : null;
      renderModal();
    }
    function openEditarAgendamentoModal(appId) {
      const app = state.appointments.find(a => a.id === appId);
      if (!app) return;
      state.activeModal = 'novoAgendamento';
      state.modalData = { app };
      renderModal();
    }
    function openVendaAvulsaModal() {
      state.activeModal = 'vendaAvulsa';
      state.modalData = { method: 'Pix' };
      renderModal();
    }
    function openNovoGastoModal() {
      state.activeModal = 'novoGasto';
      state.modalData = null;
      renderModal();
    }
    function openNovoServicoModal() {
      state.activeModal = 'novoServico';
      state.modalData = null;
      renderModal();
    }
    function openEditarServicoModal(serviceId) {
      const service = state.services.find(s => s.id === serviceId);
      if (!service) return;
      state.activeModal = 'novoServico';
      state.modalData = { service };
      renderModal();
    }
    // fromAgendamento: depois de cadastrar, volta para o agendamento já com a cliente escolhida
    function openNovaClienteModal(fromAgendamento = false) {
      state.activeModal = 'novaCliente';
      state.modalData = { fromAgendamento };
      renderModal();
    }
    function openEditarClienteModal(clientId) {
      const client = state.clients.find(c => c.id === clientId);
      if (!client) return;
      state.activeModal = 'novaCliente';
      state.modalData = { client };
      renderModal();
    }

    // Submits dos modais
    function submitAgendamento() {
      const editing = state.modalData && state.modalData.app;
      const clientId = document.getElementById('na-client').value;
      const client = state.clients.find(c => c.id === clientId);
      if (!client) {
        showToast('Cadastre uma cliente antes de agendar.', 'error');
        return;
      }

      const checkedIds = Array.from(document.querySelectorAll('input[name="na-service"]:checked')).map(cb => cb.value);
      if (checkedIds.length === 0) {
        showToast('Selecione pelo menos um serviço.', 'error');
        return;
      }

      const date = document.getElementById('na-date').value;
      const time = document.getElementById('na-time').value;
      if (!date || !time) {
        showToast('Informe a data e o horário.', 'error');
        return;
      }

      const services = getServiceOptions(editing)
        .filter(s => checkedIds.includes(s.id))
        .map(s => ({ ...s }));
      const fields = {
        clientId: client.id,
        clientName: client.name,
        date,
        time,
        services,
        total: services.reduce((acc, s) => acc + s.price, 0)
      };

      if (editing) {
        state.appointments = state.appointments.map(a => (a.id === editing.id ? { ...a, ...fields } : a));
        showToast(`Agendamento de ${client.name} atualizado!`);
      } else {
        state.appointments = [...state.appointments, {
          id: 'a_' + Date.now(),
          ...fields,
          status: 'agendado',
          paymentMethod: null,
          discount: 0
        }];
        showToast(`Agendamento para ${client.name} criado com sucesso!`);
      }

      state.selectedDate = date;
      closeModal();
      renderApp();
    }

    function submitVendaAvulsa() {
      const description = document.getElementById('va-desc').value.trim();
      const amount = parseFloat(document.getElementById('va-val').value || 0);
      if (!description || !(amount > 0)) {
        showToast('Preencha a descrição e o valor corretamente.', 'error');
        return;
      }

      state.sales = [...state.sales, {
        id: 'v_' + Date.now(),
        date: todayISO(),
        description,
        amount,
        paymentMethod: state.modalData.method
      }];

      showToast(`Venda avulsa de ${formatCurrency(amount)} registrada!`);
      closeModal();
      renderApp();
    }

    function submitNovoGasto() {
      const type = document.getElementById('ng-type').value;
      const description = document.getElementById('ng-desc').value.trim();
      const amount = parseFloat(document.getElementById('ng-val').value || 0);
      const date = document.getElementById('ng-date').value || todayISO();

      if (!description || !(amount > 0)) {
        showToast('Preencha todos os campos do gasto.', 'error');
        return;
      }

      state.expenses = [{
        id: 'e_' + Date.now(),
        date,
        amount,
        type,
        description
      }, ...state.expenses];

      showToast(`Gasto de ${formatCurrency(amount)} registrado!`);
      closeModal();
      renderApp();
    }

    function submitServico() {
      const editing = state.modalData && state.modalData.service;
      const name = document.getElementById('ns-name').value.trim();
      const duration = parseInt(document.getElementById('ns-dur').value || 0);
      const price = parseFloat(document.getElementById('ns-price').value || 0);

      if (!name || !(duration > 0) || !(price > 0)) {
        showToast('Preencha todos os campos do serviço.', 'error');
        return;
      }

      if (editing) {
        state.services = state.services.map(s => (s.id === editing.id ? { ...s, name, duration, price } : s));
        showToast(`Serviço "${name}" atualizado!`);
      } else {
        state.services = [...state.services, { id: 's_' + Date.now(), name, duration, price }];
        showToast(`Serviço "${name}" cadastrado com sucesso!`);
      }
      closeModal();
      renderApp();
    }

    function deleteServico(serviceId) {
      const service = state.services.find(s => s.id === serviceId);
      if (!service || !confirm(`Excluir o serviço "${service.name}"? Os atendimentos já feitos não mudam.`)) return;
      state.services = state.services.filter(s => s.id !== serviceId);
      showToast('Serviço excluído.');
      closeModal();
      renderApp();
    }

    function submitCliente() {
      const editing = state.modalData && state.modalData.client;
      const fromAgendamento = state.modalData && state.modalData.fromAgendamento;
      const name = document.getElementById('nc-name').value.trim();
      const phone = normalizePhone(document.getElementById('nc-phone').value);
      const birthday = document.getElementById('nc-bday').value;
      const notes = document.getElementById('nc-notes').value
        .split('\n')
        .map(n => n.trim())
        .filter(Boolean);

      if (!name) {
        showToast('Preencha o nome da cliente.', 'error');
        return;
      }
      if (!isValidPhone(phone)) {
        showToast('Telefone inválido. Use DDD + número, ex: (11) 98888-7777.', 'error');
        return;
      }

      if (editing) {
        state.clients = state.clients.map(c => (c.id === editing.id ? { ...c, name, phone, birthday, notes } : c));
        state.appointments = state.appointments.map(a => (a.clientId === editing.id ? { ...a, clientName: name } : a));
        showToast(`Dados de ${name} atualizados!`);
        closeModal();
        renderApp();
        return;
      }

      const newClient = { id: 'c_' + Date.now(), name, phone, birthday, notes };
      state.clients = [...state.clients, newClient];
      showToast(`Cliente ${name} cadastrada com sucesso!`);
      closeModal();
      renderApp();
      if (fromAgendamento) openNovoAgendamentoModal(newClient.id);
    }

    // Fechar modal ao clicar fora
    document.getElementById('modal-backdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modal-backdrop') closeModal();
    });

    // Ao voltar para o app (ex.: no dia seguinte), atualiza a data de hoje
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && syncToday()) renderApp();
    });

    // Pede ao navegador para não apagar os dados sozinho quando faltar espaço
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(err => console.error('Falha ao pedir armazenamento persistente:', err));
    }

    // Permite instalar o app pelo Chrome e abrir sem internet
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.error('Falha ao registrar o service worker:', err));
    }

    // Inicialização
    renderApp();
  </script>
</body>
</html>
